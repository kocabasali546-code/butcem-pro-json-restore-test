<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bütçem Pro — Çevrimdışı JSON Ön Kontrol</title><style>body{font:16px system-ui;background:#f2f5fb;color:#17283f;margin:0;padding:24px}main{max-width:600px;margin:auto;background:white;border-radius:16px;padding:24px}h1{font-size:24px}input{max-width:100%}pre{white-space:pre-wrap;word-break:break-word;background:#eef3fb;padding:14px;border-radius:10px}small{color:#526174}</style></head><body><main><h1>Bütçem Pro — JSON Yedek Ön Kontrolü</h1><p>Bu sayfa <b>yalnızca dosyayı tarayıcıda okur</b>. Supabase bağlantısı, veri gönderme veya geri yükleme işlemi yoktur.</p><input id="file" type="file" accept=".json,application/json"><pre id="out">Bir JSON yedeği seçin.</pre><small>Bu araç yalnızca biçim ve temel kayıt bütünlüğünü denetler; uygulamanın gerçek geri yükleme işlevini test etmez.</small></main><script>const names=['transactions','budgets','category_budgets','budget_preferences','period_budgets','period_category_budgets','payment_cards','card_statements','card_statement_payments'];document.getElementById('file').addEventListener('change',async e=>{const out=document.getElementById('out');try{const f=e.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(data.format!=='butcem-pro-cloud-backup'||data.version!==1||!data.tables||typeof data.tables!=='object')throw Error('Beklenen Bütçem Pro v1 bulut yedeği biçimi bulunamadı.');let total=0;const lines=[];for(const name of names){const rows=data.tables[name];if(!Array.isArray(rows))throw Error(name+' tablosu eksik veya dizi değil.');total+=rows.length;const ids=rows.filter(x=>x&&x.id!=null).map(x=>String(x.id));if(new Set(ids).size!==ids.length)throw Error(name+' tablosunda yinelenen ID var.');lines.push(name+': '+rows.length);}const extra=Object.keys(data.tables).filter(x=>!names.includes(x));if(extra.length)throw Error('Beklenmeyen tablolar: '+extra.join(', '));out.textContent='ÖN KONTROL BAŞARILI\nToplam kayıt: '+total+'\n\n'+lines.join('\n')+'\n\nHiçbir veri sunucuya gönderilmedi.'}catch(err){out.textContent='ÖN KONTROL BAŞARISIZ: '+err.message}});</script></body></html>
